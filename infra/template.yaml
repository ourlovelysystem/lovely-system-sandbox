AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: lovely-system-sandbox - public journal (posts, comments, tags, attachments)

Parameters:
  PartyLineMaxMeetingHours:
    Type: Number
    Default: 4
    Description: >
      Development safety net. A scheduled sweep force-ends any party line
      meeting older than this many hours, regardless of activity, to limit
      cost exposure from a meeting that never gets torn down. Not a product
      behavior — the concept is a continuous, indefinitely-lived bridge.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 128
    CodeUri: ../
    Environment:
      Variables:
        POSTS_TABLE: !Ref PostsTable
        POST_TAGS_TABLE: !Ref PostTagsTable
        COMMENTS_TABLE: !Ref CommentsTable
        ATTACHMENTS_BUCKET: !Ref AttachmentsBucket
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lovely-system-sandbox-journal-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: post_id
          AttributeType: S
        - AttributeName: feed_pk
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: author_handle
          AttributeType: S
        - AttributeName: has_attachment_flag
          AttributeType: S
      KeySchema:
        - AttributeName: post_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: feed-index
          KeySchema:
            - AttributeName: feed_pk
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: author-index
          KeySchema:
            - AttributeName: author_handle
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: attachment-index
          KeySchema:
            - AttributeName: has_attachment_flag
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PostTagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lovely-system-sandbox-journal-post-tags
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tag
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: tag
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lovely-system-sandbox-journal-comments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: post_id
          AttributeType: S
        - AttributeName: comment_id
          AttributeType: S
      KeySchema:
        - AttributeName: post_id
          KeyType: HASH
        - AttributeName: comment_id
          KeyType: RANGE

  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lovely-system-sandbox-journal-attachments-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/posts/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PostTagsTable
      Events:
        Create:
          Type: Api
          Properties: { Path: "/posts", Method: post }

  GetPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/posts/get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        Get:
          Type: Api
          Properties: { Path: "/posts/{post_id}", Method: get }

  ListPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/posts/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        List:
          Type: Api
          Properties: { Path: "/posts", Method: get }

  ListPostsByTagFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/posts/list_by_tag.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostTagsTable
      Events:
        ListByTag:
          Type: Api
          Properties: { Path: "/tags/{tag}", Method: get }

  ListPostsByAuthorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/posts/list_by_author.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        ListByAuthor:
          Type: Api
          Properties: { Path: "/authors/{author_handle}", Method: get }

  CreateCommentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/comments/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        Create:
          Type: Api
          Properties: { Path: "/posts/{post_id}/comments", Method: post }

  ListCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/comments/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CommentsTable
      Events:
        List:
          Type: Api
          Properties: { Path: "/posts/{post_id}/comments", Method: get }

  PresignAttachmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/attachments/presign.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AttachmentsBucket
      Events:
        Presign:
          Type: Api
          Properties: { Path: "/attachments/presign", Method: post }

  PartyLineRecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lovely-system-sandbox-partyline-recordings-${AWS::AccountId}"

  PartyLineRecordingsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PartyLineRecordingsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: voiceconnector.chime.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${PartyLineRecordingsBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"

  PartyLineCaptureBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lovely-system-sandbox-partyline-capture-${AWS::AccountId}"

  PartyLineCaptureBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PartyLineCaptureBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: mediapipelines.chime.amazonaws.com
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
            Resource: !Sub "${PartyLineCaptureBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:chime:*:${AWS::AccountId}:*"

  PartyLineCallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lovely-system-sandbox-partyline-calls
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: call_id
          AttributeType: S
      KeySchema:
        - AttributeName: call_id
          KeyType: HASH

  PartyLineSmaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/partyline/sma.handler
      Timeout: 15
      Environment:
        Variables:
          RECORDINGS_BUCKET: !Ref PartyLineRecordingsBucket
          CAPTURE_BUCKET: !Ref PartyLineCaptureBucket
          CALLS_TABLE: !Ref PartyLineCallsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PartyLineRecordingsBucket
        - S3CrudPolicy:
            BucketName: !Ref PartyLineCaptureBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PartyLineCallsTable
        - Statement:
            - Effect: Allow
              Action:
                - chime:CreateMeeting
                - chime:CreateAttendee
                - chime:StartMeetingTranscription
                - chime:DeleteMeeting
                - chime:CreateMediaCapturePipeline
                - chime:DeleteMediaCapturePipeline
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetBucketPolicy
              Resource: "*"

  PartyLineSweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/partyline/sweep.handler
      Timeout: 30
      Environment:
        Variables:
          CALLS_TABLE: !Ref PartyLineCallsTable
          MAX_MEETING_HOURS: !Ref PartyLineMaxMeetingHours
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PartyLineCallsTable
        - Statement:
            - Effect: Allow
              Action:
                - chime:DeleteMeeting
                - chime:DeleteMediaCapturePipeline
              Resource: "*"
      Events:
        Sweep0000Utc:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
        Sweep0400Utc:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 * * ? *)
        Sweep0800Utc:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 * * ? *)

  PartyLineSmaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PartyLineSmaFunction
      Action: lambda:InvokeFunction
      Principal: voiceconnector.chime.amazonaws.com

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  PartyLineSmaFunctionArn:
    Value: !GetAtt PartyLineSmaFunction.Arn
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
